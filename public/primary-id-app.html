<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Primary iD — Your Onboarding</title>
<style>
  /* ============ Primary Design Guide v1.0 (reconciled 2 Aug 2026) ============ */
  :root{
    /* core */
    --navy:#0E2240; --blue:#24A7E0; --blueSoft:#5BC0EC;
    --cream:#FAF8F5; --warm:#FEFCF9;
    /* text */
    --ink:#121a2b; --inkSoft:#3a4a66; --muted:#7A8695;
    --line:rgba(14,34,64,.12); --lineSoft:rgba(14,34,64,.06);
    /* dimension hues — TAGGING & DATA-VIZ ONLY, never UI accents */
    --d-oral:#D4B584; --d-sleep:#7B68EE; --d-nutri:#48C28C; --d-family:#E8985E; --d-long:#D97757;
    /* semantic tiers (on-palette) */
    --t-thriving:#48C28C; --t-strong:#24A7E0; --t-found:#E8985E; --t-needs:#D97757;
    /* type */
    --serif:Georgia,'Times New Roman',serif;
    --sans:'Montserrat','Helvetica Neue',Arial,sans-serif; /* GAP-01: Montserrat spec'd, load site-wide */
    /* radius scale — the ONLY allowed values */
    --r-chip:8px; --r-card:16px; --r-panel:24px; --r-pill:999px;
    --shadow:0 18px 48px -24px rgba(14,34,64,.45);
    --shadow-sm:0 8px 24px -18px rgba(14,34,64,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--serif); color:var(--ink); background:var(--cream);
    font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .wrap{max-width:1200px; margin:0 auto; min-height:100vh; display:grid; grid-template-columns:1fr 420px}

  /* eyebrow / sans labels */
  .ey{font-family:var(--sans); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--blue); display:flex; align-items:center; gap:10px}
  .ey::before{content:""; width:26px; height:1px; background:var(--blue)}
  .ey.soft{color:var(--blueSoft)} .ey.soft::before{background:var(--blueSoft)}

  /* ---------------- LEFT : conversation ---------------- */
  .stage{position:relative; padding:44px 56px 120px; display:flex; flex-direction:column; min-height:100vh}
  .topbar{display:flex; align-items:center; gap:16px; margin-bottom:6px}
  .brand{font-family:var(--serif); font-size:22px; color:var(--navy); letter-spacing:-.01em}
  .brand b{font-weight:400} .brand .em{font-style:italic; color:var(--blue)}
  .progress{margin-left:auto; display:flex; align-items:center; gap:7px}
  .progress i{width:26px; height:3px; border-radius:var(--r-pill); background:var(--line); transition:.4s}
  .progress i.on{background:var(--blue)} .progress i.done{background:var(--navy)}

  #screens{flex:1; display:flex; flex-direction:column}
  .screen{flex:1; display:none; flex-direction:column; justify-content:center; padding:8px 0; animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .screen.active{display:flex}
  @keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}

  h1.head{font-family:var(--serif); font-weight:400; color:var(--navy); font-size:clamp(30px,3.8vw,50px); line-height:1.1; letter-spacing:-.02em; margin:18px 0 0}
  h1.head em{font-style:italic; color:var(--blue)}
  .lede{font-size:18px; color:var(--inkSoft); max-width:60ch; margin-top:16px; line-height:1.55}
  .qmeta{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; margin-top:4px}

  /* coach */
  .coach{display:flex; gap:14px; align-items:flex-start; margin-bottom:8px}
  .avatar{flex:none; width:46px; height:46px; border-radius:50%; background:var(--navy); display:flex; align-items:center; justify-content:center; position:relative}
  .avatar span{font-family:var(--serif); font-style:italic; color:var(--warm); font-size:22px; line-height:1}
  .avatar::after{content:""; position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; border-radius:50%; background:var(--t-thriving); border:3px solid var(--cream)}
  .bubble{background:var(--warm); border:1px solid var(--line); border-radius:6px var(--r-card) var(--r-card) var(--r-card); padding:14px 18px; box-shadow:var(--shadow-sm); max-width:560px}
  .bubble .who{font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
  .bubble p{font-size:16px; color:var(--inkSoft); margin:0} .bubble p+p{margin-top:8px}
  .bubble em{font-style:italic; color:var(--blue)}

  /* option list — single question per screen */
  .opts{display:flex; flex-direction:column; gap:10px; max-width:600px; margin-top:26px}
  .opt{display:flex; align-items:center; gap:15px; text-align:left; cursor:pointer; background:var(--warm); border:1px solid var(--line); border-radius:var(--r-card); padding:16px 20px; font-family:var(--serif); font-size:17px; color:var(--navy); transition:.16s; box-shadow:var(--shadow-sm); width:100%}
  .opt:hover{border-color:var(--blue); transform:translateY(-2px)}
  .opt.sel{border-color:var(--blue); background:#F2FaFe}
  .opt .chk{margin-left:auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); flex:none; position:relative; transition:.16s}
  .opt.sel .chk{border-color:var(--blue); background:var(--blue)}
  .opt.sel .chk::after{content:""; position:absolute; left:7px; top:3px; width:6px; height:11px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}

  /* goal tiles */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:600px; margin-top:26px}
  .tile{position:relative; cursor:pointer; border:1px solid var(--line); border-radius:var(--r-card); background:var(--warm); padding:20px; box-shadow:var(--shadow-sm); transition:.16s}
  .tile:hover{transform:translateY(-2px); border-color:var(--blue)}
  .tile .tt{font-family:var(--serif); font-size:18px; color:var(--navy)}
  .tile .td{font-family:var(--sans); font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.4}
  .tile .tchk{position:absolute; top:16px; right:16px; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); transition:.16s}
  .tile.sel{border-color:var(--blue); background:#F2FAFE}
  .tile.sel .tchk{border-color:var(--blue); background:var(--blue)}
  .tile.sel .tchk::after{content:""; position:absolute; top:3px; left:6px; width:6px; height:11px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}

  /* buttons */
  .cta{display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-family:var(--sans); font-weight:600; font-size:14px; letter-spacing:.02em; border:none; border-radius:var(--r-pill); padding:15px 30px; background:var(--navy); color:#fff; box-shadow:var(--shadow-sm); transition:.16s}
  .cta:hover{transform:translateY(-2px)}
  .cta.blue{background:var(--blue)}
  .cta:disabled{opacity:.35; cursor:not-allowed; transform:none}
  .ghost{background:none; border:none; cursor:pointer; font-family:var(--sans); font-size:13px; font-weight:500; color:var(--muted); padding:12px 4px}
  .ghost:hover{color:var(--navy)}
  .actions{display:flex; align-items:center; gap:18px; margin-top:32px; flex-wrap:wrap}
  .hint{font-family:var(--sans); font-size:12.5px; color:var(--muted)}

  .field{max-width:440px; margin-top:26px}
  .field label{display:block; font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--navy); margin-bottom:8px}
  .field input{width:100%; padding:14px 16px; border:1px solid var(--line); border-radius:var(--r-card); font-family:var(--serif); font-size:18px; background:var(--warm); color:var(--navy)}
  .field input:focus{outline:none; border-color:var(--blue)}

  /* dimension chip + instrument tag */
  .dchip{display:inline-flex; align-items:center; gap:10px; font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .dchip .dot{width:9px; height:9px; border-radius:50%; background:var(--dc)}
  .inst{display:inline-block; font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--dc); border:1px solid currentColor; border-radius:var(--r-chip); padding:4px 10px; margin-top:14px; opacity:.9}

  .steps{display:flex; flex-direction:column; gap:2px; max-width:600px; margin-top:26px}
  .stepitem{display:flex; gap:16px; align-items:baseline; padding:16px 0; border-bottom:1px solid var(--lineSoft)}
  .stepitem:last-child{border-bottom:none}
  .stepitem .num{font-family:var(--serif); font-style:italic; color:var(--blue); font-size:20px; flex:none; width:26px}
  .stepitem h4{font-family:var(--serif); font-weight:400; font-size:19px; color:var(--navy); margin-bottom:3px}
  .stepitem p{font-family:var(--sans); font-size:13.5px; color:var(--muted); line-height:1.5}
  .stepitem .tag{font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--dc)}

  /* reveal */
  .revealcard{background:var(--warm); border:1px solid var(--line); border-radius:var(--r-panel); padding:28px; box-shadow:var(--shadow); max-width:640px; margin-top:24px}
  .rgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .rcell{border:1px solid var(--line); border-radius:var(--r-card); padding:16px 12px; text-align:center}
  .rcell .rn{font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
  .rcell .rn .rdot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--dc); margin-right:5px; vertical-align:middle}
  .rcell .rv{font-family:var(--serif); font-size:30px; color:var(--navy); margin-top:8px; line-height:1}
  .rcell .rt{font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:6px}
  .lever{margin-top:20px; padding-top:20px; border-top:1px solid var(--line)}
  .lever .lh{font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--blue)}
  .lever h3{font-family:var(--serif); font-weight:400; font-size:22px; color:var(--navy); margin:6px 0 8px}
  .lever h3 em{font-style:italic; color:var(--blue)}
  .lever p{font-family:var(--sans); font-size:14px; color:var(--inkSoft); line-height:1.55}
  .lever .items{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .lever .items span{font-family:var(--sans); font-size:12px; font-weight:500; color:var(--navy); background:var(--cream); border:1px solid var(--line); border-radius:var(--r-chip); padding:6px 12px}
  .foot-note{font-family:var(--sans); font-size:12.5px; color:var(--muted); max-width:560px; margin-top:16px; line-height:1.55}

  /* ---------------- RIGHT : digital twin (dark, on-brand) ---------------- */
  .twin{background:var(--navy); color:#fff; position:relative; padding:40px 34px; display:flex; flex-direction:column; overflow:hidden}
  .twin::before{content:""; position:absolute; inset:0; z-index:0; background:
    radial-gradient(320px 220px at 82% 6%,rgba(91,192,236,.18),transparent 68%),
    radial-gradient(300px 240px at 8% 96%,rgba(36,167,224,.14),transparent 70%)}
  .twin::after{content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(91,192,236,.035) 0 1px,transparent 1px 4px);
    mix-blend-mode:screen}
  .twin>*{position:relative; z-index:1}
  .twin .tk{font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--blueSoft)}
  .twin .tn{font-family:var(--serif); font-size:23px; margin-top:4px; color:#fff}
  .twin .tn em{font-style:italic; color:var(--blueSoft)}
  .figwrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:320px}
  .fig{width:224px; height:auto; filter:drop-shadow(0 0 24px rgba(36,167,224,.22))}
  /* holographic scan effects */
  .hudlabel{fill:#5BC0EC; font-family:var(--sans); font-size:7px; font-weight:600; letter-spacing:.22em; opacity:.6}
  .orbit{transform-box:fill-box; transform-origin:center; animation:spin 26s linear infinite}
  .orbit2{transform-box:fill-box; transform-origin:center; animation:spin 18s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sweep{animation:sweep 3.8s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes sweep{0%{transform:translateY(-12px)} 50%{transform:translateY(316px)} 100%{transform:translateY(-12px)}}
  .spineflow{animation:flow 1.3s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  /* nodes */
  .node .ring{fill:none; stroke:rgba(255,255,255,.16); stroke-width:2; transition:1s}
  .node .core{fill:rgba(255,255,255,.06); transition:1s}
  .node .halo{fill:none; stroke:var(--nc); stroke-width:1; stroke-dasharray:2 4; stroke-opacity:0; transform-box:fill-box; transform-origin:center; transition:stroke-opacity 1s}
  .node .tick{stroke:rgba(255,255,255,0); stroke-width:1.2; stroke-linecap:round; transition:1s}
  .node text{fill:rgba(255,255,255,.32); font-family:var(--sans); font-size:8px; font-weight:600; letter-spacing:.08em; text-anchor:middle; transition:1s}
  .node.lit .ring{stroke:var(--nc); stroke-width:2.5; filter:drop-shadow(0 0 7px var(--nc))}
  .node.lit .core{fill:var(--nc); opacity:.95; filter:url(#glow)}
  .node.lit .halo{stroke-opacity:.75; animation:spin 9s linear infinite}
  .node.lit .tick{stroke:rgba(255,255,255,.55)}
  .node.lit text{fill:rgba(255,255,255,.9)}
  .node .pulse{fill:var(--nc); opacity:0}
  .node.lit .pulse{animation:pl 2.4s ease-out infinite}
  @keyframes pl{0%{opacity:.5; r:11px} 100%{opacity:0; r:26px}}
  @media(prefers-reduced-motion:reduce){ .orbit,.orbit2,.sweep,.spineflow,.node.lit .halo,.node.lit .pulse{animation:none} }

  .composite{display:flex; align-items:center; gap:18px; padding:18px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:var(--r-panel)}
  .composite .cl{font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.6)}
  .composite .cv{font-family:var(--serif); font-size:36px; line-height:1; color:#fff}
  .composite .ct{font-family:var(--serif); font-style:italic; font-size:15px; margin-top:3px}
  .dimlist{margin-top:16px; display:flex; flex-direction:column; gap:11px}
  .dimrow{display:flex; align-items:center; gap:11px; opacity:.35; transition:.6s}
  .dimrow.on{opacity:1}
  .dimrow .dmk{width:9px; height:9px; border-radius:50%; flex:none; background:var(--dc)}
  .dimrow .dnm{font-family:var(--sans); font-size:12.5px; color:rgba(255,255,255,.85)}
  .dimrow .bar{flex:1; height:4px; border-radius:var(--r-pill); background:rgba(255,255,255,.12); overflow:hidden; max-width:88px}
  .dimrow .bar i{display:block; height:100%; width:0; border-radius:var(--r-pill); background:var(--dc); transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .dimrow .dsc{margin-left:auto; font-family:var(--serif); font-size:15px; color:#fff; font-variant-numeric:tabular-nums}
  .whisper{margin-top:16px; font-family:var(--serif); font-style:italic; font-size:13.5px; color:rgba(255,255,255,.6); text-align:center; min-height:18px; transition:.4s}

  @media(max-width:920px){
    .wrap{grid-template-columns:1fr}
    .twin{order:-1; flex-direction:row; align-items:center; gap:18px; padding:18px 22px; min-height:0}
    .figwrap{min-height:0; flex:none; width:88px} .fig{width:84px}
    .twin .th{display:none}
    .twin .tstats{flex:1} .dimlist,.whisper{display:none}
    .composite{padding:12px} .composite .cv{font-size:26px}
    .stage{padding:26px 22px 100px}
    .grid{grid-template-columns:1fr}
    .rgrid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- ============ LEFT ============ -->
  <main class="stage">
    <div class="topbar">
      <div class="brand"><b>Primary</b> <span class="em">iD</span></div>
      <div class="progress" id="progress"></div>
    </div>
    <div id="screens"></div>
  </main>

  <!-- ============ RIGHT : digital twin ============ -->
  <aside class="twin">
    <div class="th">
      <div class="tk">Your digital twin</div>
      <div class="tn" id="twinName">Building<em>…</em></div>
    </div>
    <div class="figwrap">
      <svg class="fig" viewBox="0 0 200 380" id="figure" aria-hidden="true">
        <defs>
          <radialGradient id="scanG" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#5BC0EC" stop-opacity=".5"/>
            <stop offset="100%" stop-color="#5BC0EC" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="sweepG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5BC0EC" stop-opacity="0"/>
            <stop offset="45%" stop-color="#9fdcf3" stop-opacity=".55"/>
            <stop offset="55%" stop-color="#9fdcf3" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#5BC0EC" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="2.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="bodyClip">
            <circle cx="100" cy="44" r="28"/>
            <path d="M72 74 Q100 88 128 74 L140 146 Q143 162 136 166 L126 128 L124 244 Q124 256 116 256 L108 186 L92 186 L84 256 Q76 256 76 244 L74 128 L64 166 Q57 162 60 146 Z"/>
            <path d="M94 256 L88 346 Q88 353 96 353 L100 292 L104 353 Q112 353 112 346 L106 256 Z"/>
          </clipPath>
        </defs>

        <!-- rotating orbital field -->
        <g class="orbit"><ellipse cx="100" cy="152" rx="84" ry="150" fill="none" stroke="#5BC0EC" stroke-opacity=".16" stroke-width="1" stroke-dasharray="2 9"/></g>
        <g class="orbit2"><circle cx="100" cy="152" r="66" fill="none" stroke="#24A7E0" stroke-opacity=".12" stroke-width="1" stroke-dasharray="1 11"/></g>

        <!-- ground platform -->
        <ellipse cx="100" cy="356" rx="46" ry="7" fill="none" stroke="#5BC0EC" stroke-opacity=".3"/>
        <ellipse cx="100" cy="356" rx="22" ry="4" fill="url(#scanG)"/>

        <!-- holographic body fill: mesh + scan sweep, clipped to the silhouette -->
        <g clip-path="url(#bodyClip)">
          <rect x="55" y="8" width="90" height="352" fill="#5BC0EC" fill-opacity=".05"/>
          <g stroke="#5BC0EC" stroke-opacity=".13" stroke-width=".6" id="mesh"></g>
          <rect class="sweep" x="55" y="0" width="90" height="52" fill="url(#sweepG)"/>
        </g>

        <!-- body outline: doubled for a chromatic hologram edge -->
        <g fill="none" stroke-width="1.3">
          <g stroke="#24A7E0" stroke-opacity=".22" transform="translate(1.4,0)">
            <circle cx="100" cy="44" r="28"/>
            <path d="M72 74 Q100 88 128 74 L140 146 Q143 162 136 166 L126 128 L124 244 Q124 256 116 256 L108 186 L92 186 L84 256 Q76 256 76 244 L74 128 L64 166 Q57 162 60 146 Z"/>
            <path d="M94 256 L88 346 Q88 353 96 353 L100 292 L104 353 Q112 353 112 346 L106 256 Z"/>
          </g>
          <g stroke="#9fdcf3" stroke-opacity=".5">
            <circle cx="100" cy="44" r="28"/>
            <path d="M72 74 Q100 88 128 74 L140 146 Q143 162 136 166 L126 128 L124 244 Q124 256 116 256 L108 186 L92 186 L84 256 Q76 256 76 244 L74 128 L64 166 Q57 162 60 146 Z"/>
            <path d="M94 256 L88 346 Q88 353 96 353 L100 292 L104 353 Q112 353 112 346 L106 256 Z"/>
          </g>
        </g>

        <!-- data spine: mouth → down through the body, with a flowing pulse -->
        <line x1="100" y1="42" x2="100" y2="180" stroke="#5BC0EC" stroke-opacity=".3" stroke-width="1.4"/>
        <line class="spineflow" x1="100" y1="42" x2="100" y2="180" stroke="#bfeafb" stroke-width="1.6" stroke-dasharray="3 15" filter="url(#glow)"/>

        <!-- HUD frame -->
        <g stroke="#5BC0EC" stroke-width="1.4" fill="none" stroke-opacity=".5" stroke-linecap="round">
          <path d="M8 22 L8 8 L22 8"/><path d="M192 22 L192 8 L178 8"/>
          <path d="M8 358 L8 372 L22 372"/><path d="M192 358 L192 372 L178 372"/>
        </g>
        <text class="hudlabel" x="14" y="18">LIVE SCAN</text>

        <!-- dimension nodes (populated by JS) -->
        <g id="nodes"></g>
      </svg>
    </div>
    <div class="tstats">
      <div class="composite">
        <svg width="62" height="62" viewBox="0 0 62 62">
          <circle cx="31" cy="31" r="26" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="5"/>
          <circle id="cring" cx="31" cy="31" r="26" fill="none" stroke="#5BC0EC" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 31 31)" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/>
        </svg>
        <div>
          <div class="cl">Primary iD · composite</div>
          <div class="cv" id="compVal">—</div>
          <div class="ct" id="compTier" style="color:var(--blueSoft)">Just getting started</div>
        </div>
      </div>
      <div class="dimlist" id="dimlist"></div>
      <div class="whisper" id="whisper">Every answer adds a piece of you.</div>
    </div>
  </aside>
</div>

<style>

  // ---- twin ----
  function buildNodes(){

        + '<line class="tick" x1="'+(x+9)+'" y1="'+y+'" x2="'+(x+14)+'" y2="'+y+'"/>'

  function dimScore(k){ var a=S.scores[k].filter(function(x){return x!=null;}); if(!a.length) return null; return Math.round(a.reduce(function(x,y){return x+y;},0)/a.length); }
  function composite(){ var v=[]; DIMS.forEach(function(d){ var s=dimScore(d.key); if(s!=null) v.push(s); }); if(!v.length) return null; return Math.round(v.reduce(function(x,y){return x+y;},0)/v.length); }
  function updateTwin(msg){
    DIMS.forEach(function(d){ var v=dimScore(d.key); if(v!=null){
      document.getElementById("node-"+d.key).classList.add("lit");
      document.getElementById("row-"+d.key).classList.add("on");
      document.getElementById("bar-"+d.key).style.width=v+"%";
      document.getElementById("sc-"+d.key).textContent=v;
    }});
    var c=composite();
    if(c!=null){
      document.getElementById("compVal").textContent=c;
      var t=tier(c), el=document.getElementById("compTier"); el.textContent=t.w; el.style.color=t.c;
      var circ=163.4; document.getElementById("cring").style.strokeDashoffset=circ-(circ*c/100);
    }

  // ---- chip helpers (used by woven history + records) ----
  function chipItem(item, store){
    var sel=store[item.id], opts=item.type==="yn"?["Yes","No"]:item.opts;
    var chips=opts.map(function(o){
      var on=item.type==="multi"?(Array.isArray(sel)&&sel.indexOf(o)>-1):(sel===o);
      return '<button class="chip'+(on?" sel":"")+'" data-id="'+esc(item.id)+'" data-val="'+esc(o)+'" data-type="'+item.type+'">'+esc(o)+'</button>';
    }).join("");
    return '<div class="chiprow"><div class="ql">'+esc(item.q)+'</div><div class="chips">'+chips+'</div></div>';
  }
  function rowOf(el){ while(el&&!(el.classList&&el.classList.contains("chiprow"))) el=el.parentNode; return el; }
  function wireChips(store){
    Array.prototype.forEach.call(document.querySelectorAll(".chipset .chip"),function(c){
      c.onclick=function(){
        var id=c.getAttribute("data-id"), val=c.getAttribute("data-val"), type=c.getAttribute("data-type"), row=rowOf(c);
        if(type==="multi"){
          var arr=Array.isArray(store[id])?store[id]:[];
          if(val==="None"){ arr=["None"]; }
          else { var i=arr.indexOf(val); if(i>-1)arr.splice(i,1); else { arr.push(val); var n=arr.indexOf("None"); if(n>-1)arr.splice(n,1); } }
          store[id]=arr;
          Array.prototype.forEach.call(row.querySelectorAll(".chip"),function(x){ x.classList.toggle("sel", arr.indexOf(x.getAttribute("data-val"))>-1); });
        } else {
          store[id]=val;
          Array.prototype.forEach.call(row.querySelectorAll(".chip"),function(x){ x.classList.toggle("sel", x===c); });
        }
      };
    });
  }

  // ── GHL capture ───────────────────────────────────────────────────────────
  // Covers everything up to the five dimensions: identity, door, why, goals,
  // intent, pathfinder track. Fires once at the gate so a drop-off is still a
  // retained lead, then again at the dimension boundary once intent is known.
  // Upserts the same contact both times via the shared assessment_id.
  // NOTHING clinical is ever sent from here.
  var PID_ID = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
  function pidUtm(){
    var out={}, q=new URLSearchParams(location.search||"");
    ["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(function(k){
      var v=q.get(k); if(v) out[k]=v;
    });
    return out;
  }
  function pidLead(phase){
    try{
      var why = S.reason ? reasonLabel(S.reason) : "";
      fetch("/api/lead/",{
        method:"POST", keepalive:true,
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          mode:"appt",
          phase: phase,
          assessmentId: PID_ID,
          form:{
            firstName: S.name||"", lastName: S.demo.last||"",
            email: S.demo.email||"", mobile: S.demo.phone||"",
            age: S.demo.age||"", reason: why
          },
          pathway:    S.door||"",
          goals:      S.goals||[],
          intent:     S.intent||"",
          pathfinder: !!S.pathfinder,
          pfTrack:    S.pfTrack||"",
          leadSource: pidUtm()
        })
      }).catch(function(){});
    }catch(e){}
  }

  // Progressive capture. Every screen between the gate and the five dimensions
  // re-upserts the same contact, so a drop-off at ANY point keeps whatever they
  // had given by then — why, pathfinder track, goals, intent. Debounced and
  // deduped, so idle re-renders and Back navigation cost nothing.
  var _pidTimer = null, _pidSig = "";
  function pidSync(){
    if(!S.leadFired || S.pastDims) return;
    var sig = JSON.stringify([S.door,S.reason,S.reasonDetail,S.goals,S.intent,S.pathfinder,S.pfTrack]);
    if(sig === _pidSig) return;
    _pidSig = sig;
    clearTimeout(_pidTimer);
    _pidTimer = setTimeout(function(){ pidLead("progress"); }, 400);
  }

  // The door already told us why they're here — only the general/Preventive door still asks "why".
  function routeAfterGate(){
    var d=doorCfg();

  function backFromPF(){ if(doorCfg().reason) scrGate(); else scrWhy(); }

    {k:"curious", t:"Honestly, just curious", d:"I want to see where I stand"}

  function reasonLabel(k){ for(var i=0;i<REASONS.length;i++){ if(REASONS[i].k===k) return REASONS[i].t; } return ""; }
  function scrWhy(){

  function finishAlign(){

  // 3 — goals (what matters — the aspiration behind the why)
  function scrGoals(){
    var tiles=GOALS.map(function(g){ var sel=S.goals.indexOf(g.k)>-1;
      return '<div class="tile'+(sel?" sel":"")+'" data-k="'+g.k+'"><div class="tchk"></div><div class="tt">'+g.t+'</div><div class="td">'+g.d+'</div></div>';
    }).join("");
    show(
      coach("<p>Got it. Now — what matters most to you right now? Pick as many as you like; I'll keep them close.</p>")
      + '<h1 class="head">What matters <em>most to you</em>?</h1>'
      + '<div class="grid">'+tiles+'</div>'
      + '<div class="actions"><button class="cta" id="go" disabled>Continue</button><span class="hint" id="hint">There are no wrong answers</span></div>',
      0);

      };

      + '<div class="opts">'+opts.map(function(o){var sel=S.intent===o;return '<button class="opt'+(sel?" sel":"")+'" data-v="'+esc(o)+'"><span>'+esc(o)+'</span><span class="chk"></span></button>';}).join("")+'</div>'
      + '<div class="actions"><button class="ghost" id="back">Back</button></div>',
      1);

      o.onclick=function(){ S.intent=o.getAttribute("data-v"); Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(x){x.classList.remove("sel");}); o.classList.add("sel"); setTimeout(scrHow,240); };
    });

  function scrHow(){

  // dimension intro
  function scrDimIntro(){
    // Capture stops here. Everything from this screen on is clinical and stays
    // in this browser: history, safety flags, insurance, chief complaint.
    S.pastDims = true;
    var d=DIMS[S.di];

  }

  // a scored question
  function scrQuestion(){
    var d=DIMS[S.di], q=d.qs[S.qi], cur=S.scores[d.key][S.qi];
    var opts=q.a.map(function(a){ var sel=cur===a[1];
      return '<button class="opt'+(sel?" sel":"")+'" data-v="'+a[1]+'"><span>'+esc(a[0])+'</span><span class="chk"></span></button>';
    }).join("");
    show(
      '<div class="dchip" style="--dc:'+d.color+'"><span class="dot"></span>'+esc(d.name)+'</div>'
      + '<div class="qmeta">Question '+(S.qi+1)+' of '+d.qs.length+'</div>'
      + '<h1 class="head">'+esc(q.q)+'</h1>'
      + '<div class="opts">'+opts+'</div>'
      + '<div class="actions"><button class="ghost" id="back">Back</button></div>',
      3+S.di);
    Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(o){
      o.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(x){x.classList.remove("sel");});
        o.classList.add("sel");
        S.scores[d.key][S.qi]=parseFloat(o.getAttribute("data-v"));
        setTimeout(next,240);
      };
    });
    document.getElementById("back").onclick=goBack;
  }
  function next(){
    var d=DIMS[S.di];
    if(S.qi<d.qs.length-1){ S.qi++; scrQuestion(); }
    else { var v=dimScore(d.key); updateTwin(react(d,v)); if(d.hist&&d.hist.length) scrDimHistory(d); else advanceAfterDim(d); }
  }
  function goBack(){
    if(S.qi>0){ S.qi--; scrQuestion(); }
    else { scrDimIntro(); }
  }
  function react(d,v){ var t=tier(v);
    if(v>=85) return d.name+": strong. "+t.line;
    if(v>=70) return d.name+": a solid base.";
    if(v>=50) return d.name+": real signal here.";
    return d.name+": a clear place to focus.";
  }

  // woven history — a lightning round native to the dimension (flags, NOT scored)
  function scrDimHistory(d){
    S.hist[d.key]=S.hist[d.key]||{};
    var items=d.hist.map(function(it){ return chipItem(it, S.hist[d.key]); }).join("");
    show(
      '<div class="dchip" style="--dc:'+d.color+'"><span class="dot"></span>Quick record · '+esc(d.name)+'</div>'
      + coach("<p>Lightning round — a few things your care team needs for your chart. Tap what fits; skip anything that doesn't.</p>")

      + '<div class="actions"><button class="cta" id="go">Continue</button><button class="ghost" id="back">Back</button></div>',
      3+S.di);

    document.getElementById("go").onclick=function(){ advanceAfterDim(d); };
    document.getElementById("back").onclick=function(){ S.qi=d.qs.length-1; scrQuestion(); };

  function advanceAfterDim(d){ var v=dimScore(d.key); if(S.di<DIMS.length-1) scrDimReact(d,v); else scrSafety(); }

  // between dimensions
  function scrDimReact(d,v){
    var nx=DIMS[S.di+1], t=tier(v);
    show(
      '<div class="dchip" style="--dc:'+d.color+'"><span class="dot"></span>Added to your twin</div>'
      + coach("<p><b>"+esc(d.name)+" — "+v+".</b> "+esc(t.line)+"</p><p>That's "+(S.di+1)+" of "+DIMS.length+". Next: <em>"+esc(nx.name)+"</em>.</p>")
      + '<h1 class="head">'+encourage(v)+'</h1>'
      + '<p class="lede">Look right — '+esc(d.name)+' just came online on your digital twin. Keep going and watch the rest fill in.</p>'
      + (d.learn?'<div class="insight"><div class="il">Why this matters</div><p>'+esc(d.learn)+'</p></div>':'')
      + '<div class="actions"><button class="cta" id="go">Continue to '+esc(nx.name)+'</button><button class="ghost" id="back">Back</button></div>',
      3+S.di);
    document.getElementById("go").onclick=function(){ S.di++; S.qi=0; scrDimIntro(); };
    document.getElementById("back").onclick=function(){ if(d.hist&&d.hist.length) scrDimHistory(d); else { S.qi=d.qs.length-1; scrQuestion(); } };

  function encourage(v){ return v>=85?"You’re <em>flourishing</em> here." : v>=70?"You’re building <em>something real</em>." : "This is <em>exactly</em> why you’re here."; }

  // safety check — the medical flags, one honest beat (NOT gamified into dishonesty)
  var SAFETY=["Daily prescription meds","Drug allergy","Material allergy (latex / metals)","Heart valve / cardiac condition","Blood thinner / bleeding disorder","Cancer, chemo, or radiation history","Bone medication (bisphosphonates)","Pregnant or breastfeeding","Hospitalized or surgery in last 2 yrs"];
  function scrSafety(){
    updateTwin("Locking in your record…");
    var chips=SAFETY.map(function(s){var on=S.safety.indexOf(s)>-1;return '<button class="chip'+(on?" sel":"")+'" data-val="'+esc(s)+'">'+esc(s)+'</button>';}).join("")
      + '<button class="chip'+(S.safety.indexOf("None of these")>-1?" sel":"")+'" data-val="None of these">None of these</button>';
    show(
      '<div class="dchip" style="--dc:var(--blue)"><span class="dot" style="background:var(--blue)"></span>Safety check</div>'

      8);
    Array.prototype.forEach.call(document.querySelectorAll("#safechips .chip"),function(c){
      c.onclick=function(){ var val=c.getAttribute("data-val");
        if(val==="None of these"){ S.safety=["None of these"]; }
        else { var i=S.safety.indexOf(val); if(i>-1)S.safety.splice(i,1); else { S.safety.push(val); var n=S.safety.indexOf("None of these"); if(n>-1)S.safety.splice(n,1); } }
        Array.prototype.forEach.call(document.querySelectorAll("#safechips .chip"),function(x){ x.classList.toggle("sel", S.safety.indexOf(x.getAttribute("data-val"))>-1); });
      };
    });
    var add=document.getElementById("addother"); if(S.records.other) add.value=S.records.other;
    add.onchange=function(){ S.records.other=add.value.trim(); };
    document.getElementById("go").onclick=function(){ if(add.value.trim())S.records.other=add.value.trim(); scrRecords(); };
    document.getElementById("back").onclick=function(){ var d=DIMS[DIMS.length-1]; S.di=DIMS.length-1; S.qi=d.qs.length-1; scrQuestion(); };

    document.getElementById("go").onclick=function(){ ["dob","address"].forEach(function(id){var el=document.getElementById("d_"+id); if(el)S.demo[id]=el.value.trim();}); scrInsurance(); };

  function scrComplaint(){
    show(
      '<div class="dchip" style="--dc:var(--blue)"><span class="dot" style="background:var(--blue)"></span>In your words</div>'

      + '<h1 class="head">What do you want to <em>walk out with</em>?</h1>'

  // reveal
  function scrReveal(){
    updateTwin("Your baseline is complete.");
    sendResults();
    var c=composite(), ct=tier(c);
    var low=null; DIMS.forEach(function(d){ var v=dimScore(d.key); if(v!=null&&(low===null||v<low.v)) low={d:d,v:v}; });
    var levers=[];
    if(low){ var arr=low.d.qs.map(function(q,i){ return {s:low.d.qs[i].short, v:S.scores[low.d.key][i]}; })
      .filter(function(x){return x.v!=null;}).sort(function(a,b){return a.v-b.v;});
      levers=arr.slice(0,2).map(function(x){return x.s;});
    }
    var cells=DIMS.map(function(d){ var v=dimScore(d.key), t=tier(v);
      return '<div class="rcell" style="--dc:'+d.color+'"><div class="rn"><span class="rdot"></span>'+esc(d.name)+'</div>'
        + '<div class="rv">'+v+'</div><div class="rt" style="color:'+t.c+'">'+t.w+'</div></div>';
    }).join("");
    var goalLine = S.goals.length ? 'You came in for <em>'+esc(goalOf(S.goals[0]).toLowerCase())+'</em>. This is the one thing most in the way of it.' : 'This is where a first visit moves your number the most.';
    show(
      coach("<p><b>"+esc(S.name.split(" ")[0])+", your Primary iD is ready.</b> This is your <em>baseline</em> — a snapshot of you today. It's not a grade; it's the map we build your care around.</p>")
      + '<h1 class="head">Your baseline Primary iD: <em>'+c+'</em></h1>'

        + '<div class="rgrid">'+cells+'</div>'
        + '<div class="lever">'
          + '<div class="lh">Your clearest lever</div>'
          + '<h3>'+esc(low?low.d.name:"")+' — <em>'+(low?low.v:"")+'</em></h3>'
          + '<p>'+goalLine+' Your care team can build the plan around exactly this'
          + (levers.length?', starting with the two items pulling it down:':'.')+'</p>'
          + (levers.length?'<div class="items"><span>'+levers.map(esc).join('</span><span>')+'</span></div>':'')
        + '</div>'
      + '</div>'
      + '<p class="foot-note">No forms. This isn\'t a chart in a filing cabinet — it\'s a living record. It\'s yours, it moves, and it grows every visit.</p>'

      10);
    document.getElementById("go").onclick=scrJourney;
    document.getElementById("restart").onclick=function(){ location.reload(); };

  // recommended care journey — the baseline turns into a plan (JR's coaching is the "Later" tier)
  function journeyStep(tag,title,body,color){
    return '<div class="stepitem" style="--dc:'+color+'">'
      + '<div class="num" style="font-style:normal;font-size:10.5px;font-weight:700;color:'+color+';text-transform:uppercase;letter-spacing:.09em;width:46px">'+tag+'</div>'
      + '<div style="flex:1"><h4>'+title+'</h4><p style="color:var(--inkSoft)">'+body+'</p></div></div>';
  }
  function scrJourney(){
    var c=composite(), ct=tier(c);
    var ranked=DIMS.map(function(d){ return {d:d, v:dimScore(d.key)}; }).sort(function(a,b){ return a.v-b.v; });
    var lever=ranked[0], next2=ranked.slice(1,3);
    var flags=[]; S.safety.forEach(function(s){ if(s!=="None of these") flags.push(s); });
    var sh=S.hist.sleep||{}; if(sh.tmj==="Yes") flags.push("TMJ / jaw");
    var flagNote = flags.length ? ' We\'ll also keep an eye on '+esc(flags.slice(0,3).join(", "))+'.' : '';
    var goalTxt = S.goals.length ? esc(goalOf(S.goals[0]).toLowerCase()) : "your goals";
    var nowLead;
    if(S.reason==="problem") nowLead = "We start with what brought you in"+(S.reasonDetail?" — “"+esc(S.reasonDetail)+"”":"")+", then ";
    else if(S.reason==="fix") nowLead = "We start with the fix you came for"+(S.reasonDetail?" — “"+esc(S.reasonDetail)+"”":"")+", then ";
    else if(S.reason==="blindspot") nowLead = "We close the blind spot you came to close — starting with ";
    else if(S.reason==="prevent") nowLead = "We get ahead of it, exactly like you want — starting with ";
    else nowLead = "A visit built around ";
    var nowTitle="Your first visit", nowBody;
    if(S.pathfinder){
      nowTitle="Your restorative consult · Pathfinder";
      nowBody = "A consult mapped to <b>"+esc(S.pf.what||"your situation")+"</b>"+(S.pf.why?", so you can "+esc(S.pf.why.toLowerCase()):"")+"."+(S.pf.where?" "+esc(S.pf.where)+".":"")+" We'll start your foundation at <b>"+esc(lever.d.name)+"</b> ("+lever.v+") in the same visit."+flagNote;
    } else {
      nowBody = nowLead+"<b>"+esc(lever.d.name)+"</b> ("+lever.v+") — your clearest lever toward "+goalTxt+"."+flagNote;
    }
    // door recommendation (Lever 4) — only the "Now" step changes; score & tiers are identical
    var rec=doorCfg().rec;
    if(rec==="airflex"){ nowTitle="Your AirFlex Fit Assessment";
      nowBody="A complimentary AirFlex Fit Assessment + 3D scan — with your bite, gums and airway history reviewed first."
        + (S.align&&S.align.wear_tolerance==="This is why I've put treatment off"?" We heard you on wear time — that's exactly what the 12-hour protocol is built for.":"")
        + " We'll start your foundation at <b>"+esc(lever.d.name)+"</b> ("+lever.v+") in the same visit."+flagNote; }
    else if(rec==="implant"){ nowTitle="Your Implant & Longevity Assessment";
      nowBody="A 90-minute Implant & Longevity Assessment — bone, gums and bite mapped around <b>"+esc(S.pf.what||"your situation")+"</b> and planned for your whole health, not just the gap. We'll baseline <b>"+esc(lever.d.name)+"</b> ("+lever.v+") in the same visit."+flagNote; }
    else if(rec==="airway"){ nowTitle="Your airway & sleep workup";
      nowBody="A sleep & airway workup that starts from what we just saw, alongside your foundation at <b>"+esc(lever.d.name)+"</b> ("+lever.v+")."+flagNote; }
    else if(rec==="cosmetic"){ nowTitle="Your cosmetic consult";
      nowBody="A smile-design consult mapped to <b>"+esc(S.pf.what||"your smile")+"</b>, built on a foundation we set at <b>"+esc(lever.d.name)+"</b> ("+lever.v+")."+flagNote; }
    else if(rec==="longevity"){ nowTitle="Your Primary iD Plus baseline";
      nowBody="A Primary iD Plus baseline — labs, nutrition, sleep and oral microbiome integrated with your score. Your first lever: <b>"+esc(lever.d.name)+"</b> ("+lever.v+")."+flagNote; }
    else if(rec==="emergency"){ nowTitle="Your emergency visit — we'll get you seen";
      nowBody="We get you seen and out of pain first"+(S.reasonDetail?" — “"+esc(S.reasonDetail)+"”":"")+", then baseline <b>"+esc(lever.d.name)+"</b> ("+lever.v+") once you're comfortable."+flagNote; }
    show(
      coach("<p>Here's the point of all of this. Your baseline isn't the finish line — it's where your care journey begins. Here's what we'd recommend, in order.</p>")
      + '<h1 class="head">Your recommended <em>care journey</em>.</h1>'
      + '<p class="lede">Built from why you came and your baseline of <b>'+c+'</b> — '+esc(ct.w.toLowerCase())+'. Three steps, sequenced to how your body actually changes.</p>'
      + '<div class="steps">'
        + journeyStep("Now",nowTitle,nowBody, lever.d.color)
        + journeyStep("Next","Ongoing support","We support the rest of your foundation — "+next2.map(function(x){return esc(x.d.name);}).join(" and ")+" — and track your Primary iD as it moves over time.", "var(--blue)")
        + journeyStep("Later","Optimize &amp; perform","Once your foundation is set, deeper performance &amp; longevity coaching to push from healthy to your highest level.", "var(--navy)")
      + '</div>'
      + '<p class="foot-note">This is the baseline. Everything above comes from <em>your</em> answers — not a template.</p>'
      + '<div class="actions"><button class="cta blue" id="go">This one\'s yours →</button><button class="ghost" id="back">Back to my score</button></div>',
      10);
    document.getElementById("go").onclick=scrYours;
    document.getElementById("back").onclick=scrReveal;
  }

  // PATIENT takeaway — their own view (no clinical flags; they own this)
  function scrYours(){
    var c=composite(), ct=tier(c);
    var scoreChips=DIMS.map(function(d){ var v=dimScore(d.key);
      return '<div class="bscore"><div class="n">'+v+'</div><div class="l">'+esc(d.name.split(" ")[0])+'</div></div>'; }).join("");
    var saved=[];
    saved.push("Medical & dental history · complete");
    if(S.insurance.type) saved.push("Insurance · "+esc(S.insurance.type));
    var plats=(S.records.platforms||[]).filter(function(p){return p!=="None";});
    if(plats.length) saved.push("Connecting: "+plats.join(", "));
    show(
      coach("<p>This part is just for you. Everything you shared is saved, private, and portable — it's yours to keep.</p>")
      + '<h1 class="head">This one\'s <em>yours</em>.</h1>'
      + '<p class="lede">Your Primary iD lives here — a living record you own and take with you. It grows every visit.</p>'
      + '<div class="brief">'
        + '<div class="bhead"><div class="bname">'+esc(S.name||"You")+'<small>Your Primary iD</small></div>'
          + '<div class="bcomp"><div class="n">'+c+'</div><div class="t" style="color:'+ct.c+'">'+esc(ct.w)+'</div></div></div>'
        + '<div class="brow"><div class="bk">Your five dimensions</div><div class="bscores">'+scoreChips+'</div></div>'
        + (S.goals.length?'<div class="brow"><div class="bk">What matters to you</div><div class="bv">'+esc(S.goals.map(goalOf).join(" · "))+'</div></div>':'')
        + (S.complaint?'<div class="brow"><div class="bk">In your words</div><div class="bv">“'+esc(S.complaint)+'”</div></div>':'')
        + '<div class="brow"><div class="bk">Saved to your record</div><div class="bchips"><span>'+saved.map(esc).join('</span><span>')+'</span></div></div>'
      + '</div>'
      + '<p class="foot-note">No forms. Your record is private and portable — it moves with you.</p>'
      + '<div class="actions"><button class="cta blue" id="book">Book my first visit</button><button class="ghost" id="copy">Copy my results link</button><button class="ghost" id="back">Back</button><button class="ghost" id="prov" style="margin-left:auto;opacity:.6">Provider view (team only)</button></div>',
      10);
    document.getElementById("book").onclick=scrBooked;
    document.getElementById("copy").onclick=function(){ copyLink(this); };
    document.getElementById("back").onclick=scrJourney;
    document.getElementById("prov").onclick=scrProvider;
  }

  // PROVIDER view — the clinical brief. The patient never sees this in production.
  function scrProvider(){
    var c=composite(), ct=tier(c);
    // flags
    var flags=[]; S.safety.forEach(function(s){ if(s!=="None of these") flags.push(s); });
    if(S.records.other) flags.push(S.records.other);
    var sh=S.hist.sleep||{}, oh=S.hist.oral||{};
    if(sh.tmj==="Yes") flags.push("TMJ / jaw symptoms");
    if(oh.anxiety==="A lot") flags.push("High dental anxiety");
    // on record
    var onrec=[];
    var work=(oh.work||[]).filter(function(w){return w!=="None";}); if(work.length) onrec.push(work.join(", "));
    if(oh.rootcanal==="Yes") onrec.push("Root canal history");
    if(oh.extraction==="Yes") onrec.push("Prior extractions");
    if(sh.ortho==="Yes") onrec.push("Orthodontic history");
    if(oh.lastexam) onrec.push("Last exam: "+oh.lastexam);
    var plats=(S.records.platforms||[]).filter(function(p){return p!=="None";});
    if(S.records.labs) onrec.push("Labs: "+S.records.labs);
    if(plats.length) onrec.push("Data to pull: "+plats.join(", "));
    if(S.records.pcp==="Yes") onrec.push("Has a primary care doctor");

    var scoreChips=DIMS.map(function(d){ var v=dimScore(d.key);
      return '<div class="bscore"><div class="n">'+v+'</div><div class="l">'+esc(d.name.split(" ")[0])+'</div></div>'; }).join("");
    var fullName=[S.name, S.demo.last].filter(Boolean).join(" ") || "Your name";
    var demoBits=[]; if(S.demo.dob)demoBits.push("DOB "+S.demo.dob); if(S.demo.sex)demoBits.push(S.demo.sex); if(S.demo.phone)demoBits.push(S.demo.phone); if(S.demo.email)demoBits.push(S.demo.email); if(S.demo.address)demoBits.push(S.demo.address);
    var insLine = S.insurance.type ? (esc(S.insurance.type)+(S.insurance.carrier?" · "+esc(S.insurance.carrier):"")+(S.insurance.member?" · #"+esc(S.insurance.member):"")) : "Not provided";

    show(
      '<div class="provbanner"><b>Provider view</b> The patient never sees this screen — it\'s the clinical brief your care team gets from the same conversation.</div>'
      + '<h1 class="head" style="margin-top:20px">Pre-visit <em>clinical brief</em>.</h1>'
      + '<div class="brief">'
        + '<div class="bhead"><div class="bname">'+esc(fullName)+'<small>Primary iD · pre-visit brief</small></div>'
          + '<div class="bcomp"><div class="n">'+c+'</div><div class="t" style="color:'+ct.c+'">'+esc(ct.w)+'</div></div></div>'
        + (demoBits.length?'<div class="brow"><div class="bk">Demographics</div><div class="bv">'+demoBits.map(esc).join(" · ")+'</div></div>':'')
        + '<div class="brow"><div class="bk">Insurance</div><div class="bv">'+insLine+'</div></div>'
        + (S.reason?'<div class="brow"><div class="bk">Why they came</div><div class="bv"><em>'+esc(reasonLabel(S.reason))+'</em>'+(S.reasonDetail?' — “'+esc(S.reasonDetail)+'”':'')+'</div></div>':'')
        + (S.pathfinder?'<div class="brow"><div class="bk">Pathfinder · '+(S.pfTrack==="alignment"?"alignment":"restorative")+'</div><div class="bchips warn"><span>'+[S.pf.what,S.pf.why,S.pf.where].filter(Boolean).map(esc).join('</span><span>')+'</span></div></div>':'')
        + (S.pfTrack==="alignment"?'<div class="brow"><div class="bk">Aligner candidacy</div><div class="bchips">'+[(S.align.wear_tolerance?"Wear: "+S.align.wear_tolerance:""),(S.align.ortho_history?"Ortho: "+S.align.ortho_history:""),(S.align.retainer_wear?"Retainer: "+S.align.retainer_wear:"")].filter(Boolean).map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div></div>':'')
        + (doorCfg().rec==="implant"?'<div class="brow"><div class="bk">Implant candidacy</div><div class="bv">Read from flags — extractions, existing work, bisphosphonates (MRONJ), perio (see history). MRONJ review before any surgical plan if bisphosphonates positive.</div></div>':'')
        + '<div class="brow"><div class="bk">The five dimensions</div><div class="bscores">'+scoreChips+'</div></div>'
        + (S.goals.length?'<div class="brow"><div class="bk">What they want</div><div class="bv">'+esc(S.goals.map(goalOf).join(" · "))+(S.intent?' — <em>'+esc(S.intent)+'</em>':'')+'</div></div>':'')
        + '<div class="brow"><div class="bk">Care-team flags</div>'+(flags.length?'<div class="bchips warn"><span>'+flags.map(esc).join('</span><span>')+'</span></div>':'<div class="bv">None noted — cleared to proceed.</div>')+'</div>'
        + (onrec.length?'<div class="brow"><div class="bk">Medical &amp; dental history</div><div class="bchips"><span>'+onrec.map(esc).join('</span><span>')+'</span></div></div>':'')
        + (S.complaint?'<div class="brow"><div class="bk">In their words</div><div class="bv">“'+esc(S.complaint)+'”</div></div>':'')
      + '</div>'
      + '<p class="foot-note">A richer chart than a 60-question intake — captured in one conversation, with no form.</p>'
      + '<div class="actions"><button class="cta" id="back">← Back to patient view</button></div>',
      10);
    document.getElementById("back").onclick=scrYours;
  }

  function scrBooked(){
    show(
      coach("<p><b>You're all set, "+esc(S.name.split(" ")[0])+".</b> We'll reach out shortly to find your time — your Primary iD and your whole record come with you into your first visit.</p>")
      + '<h1 class="head">Welcome to <em>Primary</em>.</h1>'
      + '<p class="lede">Your digital twin is live. From here, every visit, lab, and win makes it more complete — and moves your baseline in the right direction.</p>'
      + '<div class="actions"><button class="cta" id="restart">Replay the experience</button><button class="ghost" id="prov" style="margin-left:auto;opacity:.6">Provider view (team only)</button></div>',
      10);
    document.getElementById("restart").onclick=function(){ location.reload(); };
    document.getElementById("prov").onclick=scrProvider;
  }

  buildNodes();
  if(!tryViewMode()){
    var dp=resolveDoorParam();
    if(dp){ applyDoor(dp); scrGate(); }
    else scrPathway();
  }
})();

</script>
</body>
</html>
